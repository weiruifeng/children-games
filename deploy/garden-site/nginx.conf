# Include inside an HTTPS server block with your certificate and server_name.
root /srv/garden/current/web/dist-garden;
index index.html;
client_max_body_size 24m;
location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
location /garden/ { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
location /admin/ { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
location /experiments/pinyin-garden/ { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
location ~* ^/assets/[^/]+-[A-Za-z0-9_-]+\.(js|css)$ { try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable"; }
location ~* ^/assets/garden/(files|manifests|shells)/[a-f0-9]+\.(webp|png|mp3|wav|json)$ { root /srv/garden/shared/web; types { image/webp webp; image/png png; audio/mpeg mp3; audio/wav wav; application/json json; } try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable"; }
location = /garden/sw.js { try_files $uri =404; add_header Cache-Control "no-cache"; }
location = /resource-release.json { try_files $uri =404; add_header Cache-Control "no-cache"; }
location = /resource-budget.json { try_files $uri =404; add_header Cache-Control "no-cache"; }
location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
location /credits/ { try_files $uri =404; }
location = /content-release.json { try_files $uri =404; add_header Cache-Control "no-cache"; }
location /api/ {
 proxy_pass http://127.0.0.1:3009;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_read_timeout 60s;
 add_header Cache-Control "no-store" always;
}
location / { return 404; }
