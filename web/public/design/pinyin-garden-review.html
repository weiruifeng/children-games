function header(title){return `<header class="hud"><button aria-label="回花园" onclick="go('home')">${icon('home')}</button><h1>${title}</h1><div class="balance" id="balance">${dew()}<span>${state.dew}</span></div><div class="hearts" aria-label="三颗爱心">${icon('heart').repeat(3)}</div><span class="wave">第 ${state.wave} / 3 波</span><button aria-label="伙伴图鉴" onclick="showBook(true)">${icon('book')}</button><button aria-label="暂停" onclick="openModal('pause')">${icon('pause')}</button></header>`}
function currentParts(){return state.target==='花朵'&&state.wordIndex===1?['d','u','o',3]:entries[state.target].parts}
function renderBattle(){screen='battle';const p=currentParts(),done=state.ready.has(state.target);let fields=p.map((x,i)=>i===3||x?i:null).filter(x=>x!==null);$('#app').innerHTML=header('溪谷苗圃')+`<section class="bench" aria-label="拼音工坊"><div class="target"><div class="word">${state.choice?'？':state.target==='花朵'?`<span class="${state.wordIndex===0?'focus':''}">花</span><span class="${state.wordIndex===1?'focus':''}">朵</span>`:state.target}</div><small>${done?'全队已准备':state.target==='花朵'?'拼亮着的字':'拼好共享'}</small>${!done&&state.started?`<button onclick="openModal('help')">${icon('bulb')}提示</button>`:'<div class="reserved"></div>'}</div><div class="composer"><div class="slots">${state.choice?'<strong style="font-size:29px">huā</strong>':fields.map(i=>`<div class="slot ${state.selected[i]?'filled':'empty'} ${state.correcting&&state.selected[i]!==p[i]?'bad':''}">${state.selected[i]?(i===3?['','ˉ','ˊ','ˇ','ˋ'][state.selected[i]]:state.selected[i]):''}</div>`).join('')}</div><div class="options">${state.choice?['花','瓜','火'].map(v=>`<button onclick="pickChoice('${v}')">${v}</button>`).join(''): [0,1,2].map(i=>`<div class="group" style="${!p[i]?'visibility:hidden':''}"><span>${['声母','介母','韵母'][i]}</span><div>${[...new Set([p[i]||'u',...([['b','m','h'],['i','u','ü'],['a','o','e']][i])])].slice(0,3).sort().map(v=>`<button class="${state.selected[i]===v?'chosen':''}" ${done||!state.started?'disabled':''} aria-pressed="${state.selected[i]===v}" onclick="pick(${i},'${v}')">${v}</button>`).join('')}</div></div>`).join('')+`<div class="group tones"><span>声调</span><div>${['ˉ','ˊ','ˇ','ˋ'].map((v,i)=>`<button aria-label="${['一声','二声','三声','四声'][i]}" class="${state.selected[3]===i+1?'chosen':''}" ${done||!state.started?'disabled':''} onclick="pick(3,${i+1})"><span class="mark">${toneSvg(i)}</span><small>${['一声','二声','三声','四声'][i]}</small></button>`).join('')}</div></div>`}</div><div class="feedback ${done?'good':''}" role="status">${done?'✓ 已准备 · 有匹配目标时自动攻击':state.correcting?'看看亮着的部件，换一个试试':state.wordIndex?'huā ✓ · 接着拼“朵”':''}</div></div><aside class="ammo"><strong>准备弹药</strong><div class="ammo-grid">${Object.keys(entries).map(t=>`<button class="${state.target===t?'current':''} ${state.ready.has(t)?'ready':''}" onclick="selectWord('${t}')" aria-label="选择${t}"><span style="font-size:${t.length>1?'18':'24'}px">${t}</span>${state.ready.has(t)?'<span class="check">✓</span>':''}</button>`).join('')}</div><small>汉字一直保留 · ✓ 已准备</small></aside></section><div class="arena"><aside class="shelf">${kinds.map((k,i)=>`<button class="card ${state.dew<k.cost||state.cool[i]?'unavailable':''}" data-kind="${i}" ${!state.started?'disabled':''}>${actor(i)}<strong>${k.short}</strong><small>${k.role}</small><span class="price">${dew()}${k.cost}</span>${state.cool[i]?'<span class="why">准备中</span>':state.dew<k.cost?'<span class="why">露珠不够</span>':''}</button>`).join('')}<button class="card tool ${state.shovel?'selected':''}" ${!state.started?'disabled':''} onclick="toggleShovel()"><img class="actor" src="${ROOT}props/tool_shovel.png" alt=""><strong>铲除</strong><small>挖走伙伴</small></button></aside><section class="field" aria-label="种植区域"><div class="field-note">${state.shovel?'点一下要挖走的伙伴 <button onclick="toggleShovel()">取消</button>':state.note}</div><div class="ground">${[0,1,2].map(r=>Array.from({length:6},(_,c)=>{const key=`${r}-${c}`,k=state.plants[key];return `<button class="cell ${state.shovel&&k!==undefined?'remove':''}" data-cell="${key}" aria-label="第${r+1}行第${c+1}格${k!==undefined?'，'+kinds[k].name:''}" onclick="cellClick('${key}')">${k!==undefined?actor(k)+'<span class="health"></span>'+([0,3].includes(k)&&state.ready.size?'<span class="ready-dot">✓</span>':''):''}${state.drops.has(key)?`<span role="button" aria-label="收集露珠" class="drop" onclick="event.stopPropagation();collect('${key}',this)">${dew()}</span>`:''}</button>`}).join('')+`<div class="enemy ${state.ready.has('花')?'matched':''}" data-enemy="${r}"><span class="label">${state.target==='花朵'?'花朵':'花'}</span><img class="actor" src="${ROOT}characters/enemy_ink_blob.png" alt="墨团"><small>向左走</small></div>`).join('')}</div></section></div>`;bindDrag();}
function selectWord(t){if(!state.started)return toast('先点“开始守护”');state.target=t;state.wordIndex=0;state.choice=false;state.selected=state.ready.has(t)?[...entries[t].parts]:['','','',0];state.correcting=false;renderBattle()}
function pick(i,v){state.selected[i]=v;const p=currentParts(),full=p.every((x,n)=>!x||state.selected[n]);if(full){if(p.every((x,n)=>!x||state.selected[n]===x)){if(state.target==='花朵'&&state.wordIndex===0){state.wordIndex=1;state.selected=['','','',0];state.correcting=false;renderBattle();return toast('花 huā ✓ · 接着拼“朵”')}state.ready.add(state.target);state.correcting=false;state.note='拼好啦！同一行的伙伴开始攻击';renderBattle();fire();return}if(!state.correcting)state.errors++;state.correcting=true;}renderBattle()}
function pickChoice(v){if(v==='花'){state.ready.add('花');state.note='花 huā · 全队准备好了';renderBattle();fire()}else{if(!state.correcting)state.errors++;state.correcting=true;toast('再看看 huā，换一个字试试')}}
function toggleShovel(){state.shovel=!state.shovel;renderBattle()}
function cellClick(key){if(!state.started)return;if(state.shovel){if(state.plants[key]===undefined)return toast('点有伙伴的格子');state.dew+=Math.floor(kinds[state.plants[key]].cost/2);delete state.plants[key];state.drops.delete(key);state.shovel=false;renderBattle();toast('伙伴收回了');return}if(state.plants[key]!==undefined){if(state.plants[key]===1)toast('点水滴收集露珠 · 收集器放后排更安全');else toast('同一行有匹配的墨团时，伙伴自动攻击')}else toast('把左边的伙伴拖到这里')}
function collect(key,el,automatic=false){if(state.shovel)return cellClick(key);if(modal||screen!=='battle')return;if(!state.drops.has(key))return;const from=el?.getBoundingClientRect()||document.querySelector(`[data-cell="${key}"]`)?.getBoundingClientRect(),to=$('#balance').getBoundingClientRect();state.drops.delete(key);state.dew+=25;if(from){const f=document.createElement('img');f.className='fly';f.src=ROOT+'props/pickup_dew.png';f.style.left=from.x+'px';f.style.top=from.y+'px';document.body.append(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.left=to.x+'px';f.style.top=to.y+'px';f.style.opacity='.3'}));setTimeout(()=>f.remove(),700)}renderBattle();$('#balance').classList.add('flash');toast(automatic?'露珠自动收好了 +25':'露珠 +25 · 可以种更多伙伴');}
function bindDrag(){document.querySelectorAll('[data-kind]').forEach(b=>{b.onpointerdown=e=>{const k=+b.dataset.kind;if(!state.started||modal)return;if(state.dew<kinds[k].cost)return toast('露珠不够，先收一些水滴');if(state.cool[k])return toast('伙伴正在准备，稍等一下');state.shovel=false;b.setPointerCapture(e.pointerId);drag={k,x:e.clientX,y:e.clientY,moved:false};};b.onpointermove=e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7)drag.moved=true;if(!drag.moved)return;let g=$('.ghost');if(!g){g=document.createElement('img');g.className='ghost';g.src=ROOT+'characters/'+kinds[drag.k].id+'.png';document.body.append(g);document.querySelectorAll('.cell').forEach(cell=>{if(state.plants[cell.dataset.cell]===undefined)cell.classList.add('droppable')})}g.style.left=e.clientX+'px';g.style.top=(e.clientY-48)+'px';document.querySelectorAll('.hover').forEach(x=>x.classList.remove('hover'));const cell=document.elementFromPoint(e.clientX,e.clientY-48)?.closest('[data-cell]');if(cell)cell.classList.add('hover')};b.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;$('.ghost')?.remove();document.querySelectorAll('.droppable,.hover').forEach(x=>x.classList.remove('droppable','hover'));if(!d.moved)return openRole(d.k);const cell=document.elementFromPoint(e.clientX,e.clientY-48)?.closest('[data-cell]');if(!cell)return toast('拖进亮着的空地再松手');const key=cell.dataset.cell;if(state.plants[key]!==undefined)return toast('这里有伙伴，换一块空地');state.plants[key]=d.k;if(state.note.startsWith('①'))state.note='② 点上面的 h、u、a 和一声';state.dew-=kinds[d.k].cost;state.cool[d.k]=true;renderBattle();toast('伙伴到位！');setTimeout(()=>{state.cool[d.k]=false;if(screen==='battle'&&!modal)renderBattle()},2200);if(d.k===1)state.production[key]=10};b.onpointercancel=()=>{drag=null;$('.ghost')?.remove();renderBattle()};})}
function spawnDew(key){if(state.plants[key]!==1)return;state.drops.add(key);state.dropAges[key]=0;state.note='点水滴，收露珠 · 忙着拼音也会自动收集';renderBattle();}
setInterval(()=>{if(modal||screen!=='battle'||!state.started||drag)return;for(const key of [...state.drops]){state.dropAges[key]=(state.dropAges[key]||0)+.5;if(state.dropAges[key]>=8)collect(key,null,true)}for(const [key,k] of Object.entries(state.plants)){if(k!==1)continue;state.production[key]=(state.production[key]||0)+.5;if(state.production[key]>=12&&!state.drops.has(key)){state.production[key]=0;spawnDew(key)}}},500);
function fire(){Object.entries(state.plants).filter(([,k])=>k===0||k===3).forEach(([key])=>{const from=document.querySelector(`[data-cell="${key}"] .actor`)?.getBoundingClientRect(),to=document.querySelector(`[data-enemy="${key[0]}"]`)?.getBoundingClientRect();if(!from||!to)return;const b=document.createElement('i');b.className='seed';b.style.left=from.x+from.width/2+'px';b.style.top=from.y+from.height/2+'px';document.body.append(b);requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.left=to.x+to.width/2+'px'));setTimeout(()=>{b.remove();toast('伙伴正在攻击本行的匹配目标')},750)})}
function panel(content,extra=''){$('#toast').classList.add('hidden');modal=extra||'panel';$('#overlay').innerHTML=`<div class="shade"><section class="panel ${extra==='help'?'tip-panel':''}" role="dialog" aria-modal="true">${content}</section></div>`}
function closeModal(){modal='';$('#overlay').innerHTML='';}
function openModal(type){if(screen!=='battle')renderBattle();if(type==='pause'){panel(`<div class="pause-art"><img class="hero-actor" src="${ROOT}characters/plant_dew_collector.png" alt="休息的伙伴"></div><h2>休息一下</h2><div class="actions"><button class="primary" onclick="closeModal()">${icon('play')} 继续玩</button></div><div class="actions"><button onclick="closeModal();go('home')">${icon('home')} 回花园</button><button onclick="state.muted=!state.muted;this.innerHTML=icon('sound')+(state.muted?' 声音关':' 声音开')">${icon('sound')} 声音${state.muted?'关':'开'}</button></div>`,'pause');return}
if(type==='help'){const p=currentParts();panel(`<div class="review-label">提示期间，花园暂停</div><h2>${state.target==='花朵'?state.target[state.wordIndex]:state.target}</h2><div class="reading">${state.target==='花朵'?(state.wordIndex?'duǒ':'huā'):entries[state.target].pinyin}</div><div class="help-parts">${p.map((v,i)=>v?`<span>${i===3?['','ˉ','ˊ','ˇ','ˋ'][v]:v}</span>`:'').join('')}</div><p>${state.help?'亮着的部件帮你留好了':'看一看，再自己拼一拼'}</p><div class="actions"><button class="primary" onclick="closeModal()">回去试试</button><button onclick="state.help++;state.selected=[...currentParts()];state.selected[3]=0;closeModal();renderBattle();toast('部件留好了，试着选声调')">帮我留住部件</button></div>`,'help');return}
const data={start:['一起守护花园','开始后先布置伙伴，再迎接墨团。','开始守护',()=>{state.started=true;state.note='拖伙伴到空地 · 先安排后排，再安排前排';closeModal();renderBattle()}],between:['这一波，守住啦！','伙伴留下来，下一波重新准备弹药。','开始下一波',()=>{state.wave=Math.min(3,state.wave+1);state.ready.clear();state.selected=['','','',0];state.correcting=false;closeModal();renderBattle()}],won:['花园守住啦！','认真的每一次，都让花园更美好。','下一条小路',()=>{resetState();closeModal();renderBattle()}],lost:['再试一次吧','从本波开始重新挑战，练习记录会保留。','重试这一波',()=>{resetState();closeModal();renderBattle()}]}[type];if(!data)return;window.panelAction=data[3];panel(`<img class="hero-actor" src="${ROOT}characters/${type==='lost'?'plant_vine_guard':'plant_pod_slinger'}.png" alt="花园伙伴"><h2>${data[0]}</h2>${type==='won'?`<div class="stars">${['守护','拼读','策略'].map(t=>`<span>${icon('star')}<small>${t}</small></span>`).join('')}</div><p>本关 850 分 · 发现 6 个字</p>`:`<p>${data[1]}</p>`}<div class="actions"><button class="primary" onclick="panelAction()">${icon('play')} ${data[2]}</button></div><div class="quiet"><button onclick="closeModal();go('home')">回花园</button></div>`,type)}
function openRole(k){panel(`${actor(k)}<h2>${kinds[k].name}</h2><p>${kinds[k].tip}</p><div class="actions"><button class="primary" onclick="closeModal()">知道啦</button></div>`,'role')}
function showBook(asModal=false){const body=`<h2>花园伙伴图鉴</h2><div class="book-grid">${kinds.map((k,i)=>`<article class="book-item">${actor(i)}<h3>${k.name}</h3><strong>${k.role}</strong><p>${k.tip}</p></article>`).join('')}</div>`;if(asModal){panel(body+'<div class="actions"><button class="primary" onclick="closeModal()">回到花园</button></div>','book');$('.panel').style.width='min(850px,95vw)';return}screen='book';$('#app').innerHTML=header('伙伴图鉴')+`<main class="screen">${body}<div class="actions" style="margin-top:20px"><button onclick="go('home')">回花园</button></div></main>`}
function go(where){closeModal();screen=where;if(where==='battle'){renderBattle();return}if(where==='book')return showBook();if(where==='settings'){$('#app').innerHTML=header('家长设置')+`<main class="screen"><section class="settings"><h2>按照自己的节奏</h2><div class="setting"><label for="slow">慢一点玩</label><input id="slow" type="checkbox" checked></div><div class="setting"><label for="music">音乐音量</label><input id="music" type="range" value="30"></div><div class="setting"><label for="sfx">音效音量</label><input id="sfx" type="range" value="70"></div><div class="setting"><label for="motion">减少动态效果</label><input id="motion" type="checkbox"></div><h3>学习与存档</h3><p>学习记录、导入和导出都留在家长区域。</p><button onclick="toast('设计预览：正式版沿用现有备份功能')">备份管理</button> <button onclick="openLearning()">学习记录</button><p style="font-size:13px;color:#7b8666">这是视觉评审稿，设置不保存，也不播放声音。</p><button onclick="go('home')">回花园</button></section></main>`;return}
$('#app').innerHTML=`<header class="hud"><h1>拼音花园</h1><button onclick="go('book')">${icon('book')} 图鉴</button><button onclick="go('settings')">家长设置</button></header><main class="screen"><span class="home-label">小园丁的溪谷</span><h1 class="home-title">今天，守护哪片花园？</h1><div class="home-hero"><img src="${ROOT}characters/plant_pod_slinger.png" alt="弹弓手"><div><h2>伙伴在等你</h2><button class="primary" onclick="go('battle')">${icon('play')} 继续玩</button></div></div><div class="path">${['初遇苗圃','溪边小路','松果起飞','花语树林','星光温室'].map((n,i)=>`<button class="level ${i>2?'lock':''}" onclick="${i>2?`toast('走完前一关，就能来到这里')`:`state.started=false;go('battle');openModal('start')`}"><b>${i+1}</b><small>${n}</small><small>${i<2?'★ ★ ★':i===2?'正在探险':'待开启'}</small></button>`).join('')}</div><div class="home-links"><button onclick="go('book')">认识伙伴</button><button onclick="toast('设计预览：正式版保留三个独立花园存档')">切换花园</button></div></main>`;}
function openLearning(){panel('<h2>看见进步</h2><p>一次完整尝试记一次。连续修改部件属于同一轮纠错，不重复累加错误。</p><div class="help-parts"><span>'+state.errors+' 次纠错</span><span>'+state.ready.size+' 个准备</span></div><p>这里展示本次原型的真实操作状态；不写入孩子的学习记录。</p><button class="primary" onclick="closeModal()">知道了</button>','learning')}
function openRules(){panel(`<h2>这一版要确认什么</h2><div class="notes"><p><b>手绘花园 + 简洁清楚的操作面板。</b>场景沿用已有素材，功能图标统一线宽和颜色，水滴统一使用同一张道具图。木框与叶片保持克制，不影响拼音阅读。</p><h3>① 尺寸与触屏</h3><ul><li>同一伙伴在卡片、拖动和格子里共用同一图片尺寸；1024 横屏为 64px，大屏 72px，手机 44px。铲子视觉尺寸更小，底部说明有独立留白。</li><li>横屏伙伴两列、竖屏下置，避免四张卡纵向挤压。竖屏战场独立定高，去掉大段无效空白。</li><li>横竖屏都保留四个拼音槽位。声调符号和名称整体居中；空槽用圆点，不用容易误认为一声的横线。</li><li>正式版还需逐个按透明轮廓校准素材；本稿已保证同一素材在三处尺寸一致。</li></ul><h3>② 操作与反馈</h3><ul><li>卡片拖动种植；轻点看角色用途，不进入不明确的“待放置”状态。</li><li>铲除模式优先作用于格子里的伙伴，露珠和墨团不抢点击；铲一次退出。原有半价返还规则保留，不常驻显示费用文案。</li><li>空地占用、露珠不足、伙伴准备中都在操作时明确提示。原型冷却缩短为 2.2 秒便于检查。</li><li>蓝色水滴点击范围至少 52px，飞向余额并提示 +25。原型新种收集器 2 秒后产露珠供演示；正式版继续原有产出节奏及 8 秒自动收集。</li></ul><h3>③ 学习与并行战斗</h3><ul><li>选择“花”，拼 h + u + a + 一声，三个射手同时演示本行攻击。拼好即准备弹药，不增加发射按钮。</li><li>一次错误后连续修改只记一轮纠错；错误部件用暖色提示。右侧始终保留汉字，勾选代表本波已准备。</li><li>“提示”只在有未完成任务时出现，打开时暂停战斗；右上角书本是伙伴图鉴，含义分开。</li><li>双字词高亮当前字，完成后保留上一音节。读音选字是<b>看拼音选汉字</b>，本稿没有学习语音。</li></ul><h3>④ 页面与规则</h3><ul><li>首页为关卡小路；暂停、开场、波间、胜败、提示共用花园面板。主操作突出，点击遮罩不会误恢复。</li><li>家长设置集中声音、速度、学习记录和备份。正式版继续保留 hash 路由、刷新恢复暂停和三个独立存档。</li><li>伙伴图鉴解释：收集器会被攻击，放后排；盾卫放前排；射手攻击本行前方的匹配目标。</li></ul><p><b>边界：</b>这是独立的交互设计稿，敌人不真实移动，没有完整伤害、计分和过关结算。评审栏用于查看各状态，不属于孩子的游戏界面。暂停期间不执行产露珠或自动收集；已发出的短动画可能播放至结束。</p><p><b>待确认：</b>横屏两列伙伴栏是否顺手、角色大小是否合适、工坊是否易懂、面板是否像同一个游戏。确认后再改正式实现。</p></div><button class="primary" onclick="closeModal()">回到设计稿</button>`,'rules')}
function startGuide(){state.started=true;state.note='① 把弹弓手拖到小路';closeModal();renderBattle()}
function sceneChange(value){closeModal();history.replaceState(null,'','#'+value);if(['home','book','settings'].includes(value)){go(value);return}if(value==='onboarding'){resetState();state.started=false;state.plants={};state.drops.clear();renderBattle();panel('<h2>先认识两位伙伴</h2><div class="help-parts">'+actor(0)+actor(1)+'</div><p>弹弓手打墨团，收集器产露珠。<br>先把弹弓手拖到小路，再拼读音。</p><button class="primary" onclick="startGuide()">开始试试</button>','onboarding');return}if(value==='start'){resetState();state.started=false;state.plants={};state.drops.clear();renderBattle();openModal('start');return}state.started=true;renderBattle();if(value==='shovel'){state.shovel=true;renderBattle()}else if(value==='choose'){selectWord('花');state.choice=true;renderBattle()}else if(value==='word'){selectWord('花朵')}else if(value!=='battle')openModal(value)}
function resetDemo(){resetState();closeModal();$('#scene').value='battle';history.replaceState(null,'','#battle');renderBattle();toast('已重置设计稿，不影响正式存档')}
$('#scene').addEventListener('change',e=>sceneChange(e.target.value));$('#scene option[value="choose"]').textContent='看拼音选汉字';const initial=location.hash.slice(1)||'battle';$('#scene').value=initial;sceneChange(initial);
</script>
