<body>

<main class="app">
<header class="top"><div class="brand"><svg viewBox="0 0 40 40"><path d="M20 35V16" stroke="#708e50" stroke-width="3"/><path d="M20 24C-1 23 5 4 20 16C34-3 44 18 20 24" fill="#91aa6e"/></svg>拼音花园<span class="edition">PLAY / 05</span></div><div class="top-right"><span class="count"><b id="count">0</b>/ 6 ✦</span><button class="round" id="pause" aria-label="暂停战斗">Ⅱ</button><button class="round" id="demo" aria-label="看手势">☝</button><button class="round" id="reset" aria-label="重新体验">↻</button></div></header>
<section class="composer" aria-label="拼音弹药台"><div class="target-card"><span class="eyebrow">这次的汉字</span><div class="target-glyph" id="target">马</div><span class="target-route" id="target-route">上路</span><div class="target-label">第 <b id="number">1</b> 个小发现</div></div><div class="parts"><div class="slots"><div class="slot empty" data-slot="initial"><small>声母</small><b>—</b></div><span class="plus">+</span><div class="slot empty" data-slot="final"><small>韵母</small><b>—</b></div><span class="plus">+</span><div class="slot empty" data-slot="tone"><small>声调</small><b>—</b></div></div><div class="choices"><div class="group"><label class="group-label">声母</label><div class="options" id="initials"></div></div><div class="group"><label class="group-label">韵母</label><div class="options" id="finals"></div></div><div class="group tones"><label class="group-label">声调</label><div class="options" id="tones"></div></div></div><p class="hint" id="hint" role="status">先把左边的伙伴拖到中间小路，再来拼一颗子弹。</p></div><div class="shared-bank"><strong>全队弹药</strong><div id="bank"></div><span class="bank-note">本波无限用</span></div></section>
<section class="play"><aside class="rack"><span class="rack-title">花园伙伴</span><button class="partner-card" id="partner" aria-label="拖动备用射手种植"><svg><use href="#slinger"/></svg><strong>豆荚弹弓手</strong><small id="partner-note">拖到小路上</small></button><div class="rack-note">捏住卡片<br>移动，再松手</div></aside><div class="field" id="field"><div class="field-top"><span>溪谷苗圃 · 第一次出发</span><div class="progress"><i></i><i></i><i></i></div></div><div class="greenhouse"><svg viewBox="0 0 55 90"><path d="M4 34L27 10L51 34V82H4Z" fill="#f3e7bd"/><path d="M1 35L27 7L54 35" fill="none" stroke="#8faa7c" stroke-width="4"/><path d="M19 82V54Q28 43 37 54V82" fill="#98b49b"/><path d="M11 39H44M28 15V40" stroke="#c1cba3" stroke-width="2"/></svg><span>小苗圃</span></div><div class="rows"><div class="lane active" id="lane0" data-row="0"></div><div class="lane active" id="lane1" data-row="1"></div></div><div class="field-message" id="field-message">先试这一条小路，慢慢来也没关系</div><div class="toast" id="toast" role="status"></div><div class="paused-overlay" id="paused">休息一下</div><div class="finish" id="finish"><article><div class="stars">✦ ✦ ✦</div><h2>一起守住啦！</h2><p>伙伴保留 · 下一波重新补充弹药</p><button id="again">下一波 →</button></article></div></div></section>
<footer class="footer"><div class="steps"><span class="active" data-step="0"><i>1</i>拖伙伴种下</span><span data-step="1"><i>2</i>点拼音组合</span><span data-step="2"><i>3</i>拖子弹发射</span></div><span>触摸交互稿 · 无计时压力 · <strong>选择不会被自动清空</strong></span></footer>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const lessons=[{id:'horse',text:'马',initial:'m',final:'a',tone:3,pinyin:'mǎ'},{id:'rice',text:'米',initial:'m',final:'i',tone:3,pinyin:'mǐ'},{id:'wood',text:'木',initial:'m',final:'u',tone:4,pinyin:'mù'}];
const lesson=id=>lessons.find(l=>l.id===id),empty=()=>({initial:'',final:'',tone:0});
let drafts={},unlocked=new Set(),active='horse',shooters=[],enemies=[],queue=[],shots=[],drag=null,epoch=0,wave=1,paused=false,finished=false,kills=0,toastTimer,hand=null;
const marks=['','ˉ','ˊ','ˇ','ˋ'];
for(let row=0;row<2;row++){const lane=$('#lane'+row);lane.dataset.label=row?'下路':'上路';for(let col=0;col<5;col++){const c=document.createElement('div');c.className='plot';c.dataset.row=row;c.dataset.col=col;c.innerHTML='<div class="empty-route"></div>';lane.append(c);}}
const cellAt=(r,c)=>$(`#lane${r}>.plot[data-col="${c}"]`);
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1500);}
function selectLesson(id){if(paused||drag||finished)return;active=id;render();}
for(const l of lessons){const b=document.createElement('button');b.className='bank-ammo';b.dataset.lesson=l.id;b.setAttribute('aria-label',`选择${l.text}的弹药`);b.innerHTML=`<b>${l.text}</b><span>◌</span>`;b.onclick=()=>selectLesson(l.id);$('#bank').append(b);}
function options(id,key,values){for(const value of values){const b=document.createElement('button');b.className='chip';b.dataset.key=key;b.dataset.value=value;b.innerHTML=key==='tone'?marks[value]+'<small>'+['','一声','二声','三声','四声'][value]+'</small>':value;b.setAttribute('aria-label',key==='tone'?['','一声','二声','三声','四声'][value]:value);b.onclick=()=>{if(paused||finished||unlocked.has(active))return;drafts[active][key]=value;const l=lesson(active),d=drafts[active];if(['initial','final','tone'].every(k=>d[k]===l[k]))unlock(l);else if(d.initial&&d.final&&d.tone)toast('再看看亮着的卡片');render();};$(id).append(b);}}
options('#initials','initial',['b','m','p']);options('#finals','final',['a','i','u']);options('#tones','tone',[1,2,3,4]);
function unlock(l){if(unlocked.has(l.id))return;unlocked.add(l.id);toast(l.pinyin+' · 全队可用！');const from=$('.slots').getBoundingClientRect(),bank=$(`[data-lesson="${l.id}"]`),to=bank.getBoundingClientRect();bank.classList.add('pop');const orb=document.createElement('div');orb.className='unlock-orb';orb.textContent=l.pinyin;orb.style.left=from.left+from.width/2-34+'px';orb.style.top=from.top+'px';document.body.append(orb);const a=orb.animate([{transform:'translate(0,0) scale(.7)',opacity:1},{transform:`translate(${to.left+to.width/2-from.left-from.width/2}px,${to.top-from.top}px) scale(.5)`,opacity:0}],{duration:600,fill:'forwards',easing:'ease-in'});a.onfinish=()=>{orb.remove();bank.classList.remove('pop');};}
function addShooter(row,col){const p={id:shooters.length+1,row,col,timer:0,shots:0};shooters.push(p);const cell=cellAt(row,col);cell.classList.add('receiver');const b=document.createElement('div');b.className='shooter';b.dataset.shooter=p.id;b.setAttribute('aria-label',`${row?'下':'上'}路 ${p.id} 号射手`);b.innerHTML=`<div class="plant"><svg><use href="#slinger"/></svg></div><b>${p.id}</b><span class="shot-count" aria-label="累计发射">0 ↗</span>`;cell.append(b);p.el=b;return p;}
function spawn(def){const e={...def,id:`${epoch}-${def.row}-${def.lesson}`,hp:180,maxHp:180,dead:false,col:def.col};const b=document.createElement('button');b.className='enemy missing';b.dataset.enemy=e.id;b.setAttribute('aria-label',`选择${e.row?'下':'上'}路目标${lesson(e.lesson).text}`);b.innerHTML=`<span class="enemy-glyph">${lesson(e.lesson).text}</span><svg><use href="#blob"/></svg><span class="enemy-health"><i style="width:100%"></i></span>`;b.style.left=`calc(${(e.col+.5)*20}% - 37px)`;b.onclick=()=>selectLesson(e.lesson);$('#lane'+e.row).append(b);e.el=b;enemies.push(e);}
function render(){const l=lesson(active),d=drafts[active],complete=!!(d.initial&&d.final&&d.tone);$('#target').textContent=l.text;$('#target-route').textContent=unlocked.has(active)?'已共享 ∞':'拼好即共享';$('#count').textContent=kills;$('#number').textContent=wave;$('.field-top>span').textContent=`第 ${wave} 波 · ${shooters.length} 位伙伴`;$('#hint').textContent=unlocked.has(active)?'所有伙伴都能使用，继续拼其他弹药。':'拼对一次，全队本波共享。';
for(const key of ['initial','final','tone']){const slot=$(`[data-slot="${key}"]`);slot.querySelector('b').textContent=(key==='tone'?marks[d[key]]:d[key])||'—';slot.classList.toggle('empty',!d[key]);slot.classList.toggle('check',complete&&d[key]!==l[key]);}
$$('.chip').forEach(b=>{const on=String(d[b.dataset.key])===b.dataset.value;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on);b.disabled=paused||finished||unlocked.has(active);});for(const l of lessons){const b=$(`[data-lesson="${l.id}"]`);b.classList.toggle('unlocked',unlocked.has(l.id));b.classList.toggle('current',active===l.id);b.querySelector('b').textContent=unlocked.has(l.id)?l.pinyin:l.text;b.querySelector('span').textContent=unlocked.has(l.id)?'∞':'◌';b.disabled=paused||finished;}
for(const e of enemies){e.el.classList.toggle('selected-target',!e.dead&&e.lesson===active);e.el.classList.toggle('missing',!unlocked.has(e.lesson));e.el.disabled=paused||finished||e.dead;}
$('#partner').disabled=paused||finished||shooters.length>=6;$('#paused').classList.toggle('show',paused);$('#pause').textContent=paused?'▶':'Ⅱ';$('#pause').setAttribute('aria-label',paused?'继续战斗':'暂停战斗');}
function impact(e){if(e.dead)return;e.hp=Math.max(0,e.hp-10);e.el.querySelector('.enemy-health i').style.width=e.hp/e.maxHp*100+'%';e.el.classList.add('damage');setTimeout(()=>e.el.classList.remove('damage'),100);if(e.hp===0){e.dead=true;e.el.style.visibility='hidden';kills++;burst(e.el.getBoundingClientRect());const next=queue.findIndex(q=>q.row===e.row);if(next>=0)spawn({...queue.splice(next,1)[0],col:e.col});if(kills===6){finished=true;$('#finish').classList.add('show');}render();}}
function burst(r){for(let i=0;i<7;i++){const s=document.createElement('div');s.className='hit-star';s.textContent='✦';s.style.left=r.left+r.width/2+'px';s.style.top=r.top+r.height/2+'px';document.body.append(s);const a=s.animate([{transform:'scale(1)',opacity:1},{transform:`translate(${Math.cos(i)*60}px,${Math.sin(i)*60}px) scale(.2)`,opacity:0}],{duration:500,fill:'forwards'});a.onfinish=()=>s.remove();}}
function fire(p,e){p.shots++;p.el.querySelector('.shot-count').textContent=p.shots+' ↗';p.el.classList.remove('firing');void p.el.offsetWidth;p.el.classList.add('firing');const r=cellAt(p.row,p.col).getBoundingClientRect(),to=e.el.getBoundingClientRect();const b=document.createElement('div');b.className='projectile';b.dataset.from=p.id;b.dataset.target=e.id;b.textContent=lesson(e.lesson).pinyin;document.body.append(b);shots.push({el:b,p,e,age:0,fromX:r.left+r.width/2,fromY:r.top+r.height*.45,toX:to.left+to.width/2,toY:to.top+to.height*.6});}
let last=performance.now();function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!finished&&!document.hidden){for(const p of shooters){p.timer=Math.max(0,p.timer-dt);if(p.timer===0){const e=enemies.filter(e=>!e.dead&&e.row===p.row&&e.col>p.col&&unlocked.has(e.lesson)).sort((a,b)=>a.col-b.col)[0];if(e){fire(p,e);p.timer=1.25;}}}for(const s of [...shots]){s.age+=dt;const t=Math.min(s.age/.65,1);s.el.style.left=s.fromX+(s.toX-s.fromX)*t+'px';s.el.style.top=s.fromY+(s.toY-s.fromY)*t+'px';s.el.style.transform='translate(-50%,-50%)';if(t===1){s.el.remove();shots=shots.filter(x=>x!==s);impact(s.e);}}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
function rectHit(r,x,y){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function emptyCell(x,y){const cells=$$('.lane>.plot').filter(c=>Number(c.dataset.col)<3&&!c.classList.contains('receiver'));return cells.find(c=>rectHit(c.getBoundingClientRect(),x,y-47))??cells.find(c=>rectHit(c.getBoundingClientRect(),x,y));}
function beginDrag(e){if(e.button!==0||drag||paused||finished||shooters.length>=6)return;stopDemo();const el=e.currentTarget;el.setPointerCapture(e.pointerId);const ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML='<svg><use href="#slinger"/></svg>';ghost.style.display='none';document.body.append(ghost);drag={id:e.pointerId,source:el,ghost,x:e.clientX,y:e.clientY,moved:false};}
function moveDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>7)d.moved=true;if(!d.moved)return;d.source.classList.add('drag-source');d.ghost.style.display='grid';d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';$$('.plot').forEach(c=>{c.classList.remove('drop-hover');c.classList.toggle('drop-ok',Number(c.dataset.col)<3&&!c.classList.contains('receiver'));});emptyCell(e.clientX,e.clientY)?.classList.add('drop-hover');}
function endDrag(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;d.source.classList.remove('drag-source');d.ghost.remove();$$('.plot').forEach(c=>c.classList.remove('drop-ok','drop-hover'));if(cancel)return;const c=d.moved?emptyCell(e.clientX,e.clientY):null;if(c){addShooter(Number(c.dataset.row),Number(c.dataset.col));toast('一起开火！');render();}else toast('拖到空地');}
$('#partner').onpointerdown=beginDrag;$('#partner').onpointermove=moveDrag;$('#partner').onpointerup=e=>endDrag(e);$('#partner').onpointercancel=e=>endDrag(e,true);$('#partner').onlostpointercapture=e=>{if(drag)endDrag(e,true);};
function stopDemo(){hand?.remove();hand=null;}
function reset(keep=false){epoch++;stopDemo();clearTimeout(toastTimer);if(drag)endDrag({pointerId:drag.id},true);$$('.enemy,.projectile,.hit-star,.unlock-orb').forEach(e=>e.remove());shots=[];unlocked=new Set();drafts=Object.fromEntries(lessons.map(l=>[l.id,empty()]));active='horse';paused=false;finished=false;kills=0;enemies=[];queue=[{row:0,col:4,lesson:'wood'},{row:1,col:4,lesson:'rice'}];if(!keep){wave=1;shooters=[];$$('.shooter').forEach(e=>e.remove());$$('.plot').forEach(c=>c.className='plot');addShooter(0,0);addShooter(1,0);addShooter(1,1);}else{wave++;for(const p of shooters){p.timer=0;p.shots=0;p.el.querySelector('.shot-count').textContent='0 ↗';}}
spawn({row:0,col:3,lesson:'rice'});spawn({row:0,col:4,lesson:'horse'});spawn({row:1,col:3,lesson:'horse'});spawn({row:1,col:4,lesson:'wood'});$('#finish').classList.remove('show');$('#toast').classList.remove('show');render();}
$('#reset').onclick=()=>reset();$('#again').onclick=()=>reset(true);$('#pause').onclick=()=>{paused=!paused;if(drag)endDrag({pointerId:drag.id},true);render();};
$('#demo').onclick=()=>{stopDemo();toast('拼好一次，全队开火');const r=$('#bank').getBoundingClientRect();hand=document.createElement('div');hand.className='tutorial-hand';hand.textContent='☝️';hand.style.left=r.left+'px';hand.style.top=r.bottom+'px';document.body.append(hand);const h=hand;const a=h.animate([{transform:'translateY(8px)',opacity:0},{transform:'translateY(0)',opacity:1},{transform:'translateY(8px)',opacity:0}],{duration:1300,iterations:2});a.onfinish=()=>{h.remove();if(hand===h)hand=null;};};
window.addEventListener('blur',()=>{if(drag)endDrag({pointerId:drag.id},true);});reset();
</script></body></html>
