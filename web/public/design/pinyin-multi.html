@media(max-width:760px){.rows{inset:25px 8px 18px 32px;gap:15px}.lane::before{left:-25px;writing-mode:vertical-rl;font-size:12px}.enemy{width:45px;height:88px}.enemy-glyph{font-size:25px}.enemy svg{width:47px;height:45px}.enemy.selected-target::after{top:-17px;font-size:16px}.target-route{font-size:12px;padding:2px 8px}.shooter .plant{inset:0}.shooter b{height:19px;min-width:19px;line-height:17px;font-size:12px;bottom:2px}.ammo-caption strong{font-size:14px}.shooter .plant svg{height:min(100%,80px)}}
@media(prefers-reduced-motion:reduce){.plot.receiver.pick-pulse{animation:none}}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="slinger" viewBox="0 0 100 110"><ellipse cx="50" cy="98" rx="33" ry="7" fill="#547749" opacity=".16"/><path d="M49 95V56L23 24M49 56L77 20" fill="none" stroke="#795e3d" stroke-width="12" stroke-linecap="round"/><path d="M23 24Q48 84 77 20" fill="none" stroke="#b49258" stroke-width="3"/><path d="M42 78Q16 53 10 71Q12 90 42 84M58 80Q82 56 91 72Q89 91 58 86" fill="#6e9d66"/><path d="M29 58Q48 49 69 60Q66 80 49 82Q32 79 29 58" fill="#7ca46a"/><ellipse cx="40" cy="65" rx="6" ry="7" fill="#fff9dc"/><ellipse cx="57" cy="65" rx="6" ry="7" fill="#fff9dc"/><circle cx="41" cy="66" r="2.5" fill="#365341"/><circle cx="58" cy="66" r="2.5" fill="#365341"/><path d="M44 75Q49 79 54 75" stroke="#38573c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M67 22Q60 3 76 5Q90 9 78 23" fill="#7ca46a"/><path d="M24 26Q8 23 12 10Q26 7 27 23" fill="#99b877"/></symbol>
<symbol id="blob" viewBox="0 0 90 80"><ellipse cx="45" cy="74" rx="29" ry="5" fill="#536349" opacity=".17"/><path d="M17 61Q9 43 29 25Q39 14 48 6Q46 26 63 30Q86 44 74 64Q62 77 38 72Q22 72 17 61" fill="#797a9c"/><path d="M23 45Q26 31 37 27" fill="none" stroke="#a3a0b9" stroke-width="5" stroke-linecap="round"/><ellipse cx="34" cy="48" rx="7" ry="9" fill="#fff9de"/><ellipse cx="58" cy="48" rx="7" ry="9" fill="#fff9de"/><circle cx="32" cy="49" r="3" fill="#4a5069"/><circle cx="56" cy="49" r="3" fill="#4a5069"/><path d="M40 61Q45 65 50 61" fill="none" stroke="#53556f" stroke-width="2" stroke-linecap="round"/></symbol>
</defs></svg>
<main class="app">
<header class="top"><div class="brand"><svg viewBox="0 0 40 40"><path d="M20 35V16" stroke="#708e50" stroke-width="3"/><path d="M20 24C-1 23 5 4 20 16C34-3 44 18 20 24" fill="#91aa6e"/></svg>拼音花园<span class="edition">PLAY / 04</span></div><div class="top-right"><span class="count"><b id="count">0</b>/ 3 ✦</span><button class="round" id="demo" aria-label="看手势">☝</button><button class="round" id="reset" aria-label="重新体验">↻</button></div></header>
<section class="composer" aria-label="拼音弹药台"><div class="target-card"><span class="eyebrow">这次的汉字</span><div class="target-glyph" id="target">米</div><span class="target-route" id="target-route">上路</span><div class="target-label">第 <b id="number">1</b> 个小发现</div></div><div class="parts"><div class="slots"><div class="slot empty" data-slot="initial"><small>声母</small><b>—</b></div><span class="plus">+</span><div class="slot empty" data-slot="final"><small>韵母</small><b>—</b></div><span class="plus">+</span><div class="slot empty" data-slot="tone"><small>声调</small><b>—</b></div></div><div class="choices"><div class="group"><label class="group-label">声母</label><div class="options" id="initials"></div></div><div class="group"><label class="group-label">韵母</label><div class="options" id="finals"></div></div><div class="group tones"><label class="group-label">声调</label><div class="options" id="tones"></div></div></div><p class="hint" id="hint" role="status">先把左边的伙伴拖到中间小路，再来拼一颗子弹。</p></div><div class="ammo-zone"><span class="eyebrow">我的子弹</span><button id="ammo" class="ammo-button" aria-label="完整拼音子弹" disabled>···</button><div class="ammo-caption" id="ammo-caption" role="button" tabindex="0" aria-label="发射完整子弹">选齐三个部件<br>子弹就会出现</div></div></section>
<section class="play"><aside class="rack"><span class="rack-title">花园伙伴</span><button class="partner-card" id="partner" aria-label="拖动备用射手种植"><svg><use href="#slinger"/></svg><strong>豆荚弹弓手</strong><small id="partner-note">拖到小路上</small></button><div class="rack-note">捏住卡片<br>移动，再松手</div></aside><div class="field" id="field"><div class="field-top"><span>溪谷苗圃 · 第一次出发</span><div class="progress"><i></i><i></i><i></i></div></div><div class="greenhouse"><svg viewBox="0 0 55 90"><path d="M4 34L27 10L51 34V82H4Z" fill="#f3e7bd"/><path d="M1 35L27 7L54 35" fill="none" stroke="#8faa7c" stroke-width="4"/><path d="M19 82V54Q28 43 37 54V82" fill="#98b49b"/><path d="M11 39H44M28 15V40" stroke="#c1cba3" stroke-width="2"/></svg><span>小苗圃</span></div><div class="rows"><div class="lane active" id="lane0" data-row="0"></div><div class="lane active" id="lane1" data-row="1"></div></div><div class="field-message" id="field-message">先试这一条小路，慢慢来也没关系</div><div class="toast" id="toast" role="status"></div><div class="finish" id="finish"><article><div class="stars">✦ ✦ ✦</div><h2>三位伙伴，守住啦！</h2><p>米 mǐ · 马 mǎ · 木 mù</p><button id="again">再玩一遍</button></article></div></div></section>
<footer class="footer"><div class="steps"><span class="active" data-step="0"><i>1</i>拖伙伴种下</span><span data-step="1"><i>2</i>点拼音组合</span><span data-step="2"><i>3</i>拖子弹发射</span></div><span>触摸交互稿 · 无计时压力 · <strong>选择不会被自动清空</strong></span></footer>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const definitions=[{id:'rice',text:'米',row:0,col:4,initial:'m',final:'i',tone:3,pinyin:'mǐ'},{id:'horse',text:'马',row:1,col:3,initial:'m',final:'a',tone:3,pinyin:'mǎ'},{id:'wood',text:'木',row:1,col:4,initial:'m',final:'u',tone:4,pinyin:'mù'}];
const empty=()=>({initial:'',final:'',tone:0});
let enemies=[],shooters=[],drafts={},targetId='rice',ready=false,busy=false,picking=false,drag=null,epoch=0,toastTimer,hand=null,handAnimation=null;
const marks=['','ˉ','ˊ','ˇ','ˋ'];
for(let row=0;row<2;row++){const lane=$('#lane'+row);lane.dataset.label=row?'下路':'上路';for(let col=0;col<5;col++){const cell=document.createElement('div');cell.className='plot';cell.dataset.row=row;cell.dataset.col=col;cell.innerHTML='<div class="empty-route"></div>';lane.append(cell);}}
const cellAt=(row,col)=>$(`#lane${row}>.plot[data-col="${col}"]`);
const target=()=>enemies.find(e=>e.id===targetId&&!e.dead);
const compatible=()=>{const t=target();return t?shooters.filter(p=>p.row===t.row&&p.col<t.col):[];};
function setTarget(id){if(busy||drag||!enemies.some(e=>e.id===id&&!e.dead))return;targetId=id;picking=false;render();}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1600);}
function options(id,key,values){for(const value of values){const b=document.createElement('button');b.className='chip';b.dataset.key=key;b.dataset.value=value;b.innerHTML=key==='tone'?marks[value]+'<small>'+['','一声','二声','三声','四声'][value]+'</small>':value;b.setAttribute('aria-label',key==='tone'?['','一声','二声','三声','四声'][value]:value);b.onclick=()=>{if(busy||drag||!target())return;drafts[targetId][key]=value;picking=false;render();const d=drafts[targetId];if(d.initial&&d.final&&d.tone&&!ready)toast('再看看亮着的卡片');};$(id).append(b);}}
options('#initials','initial',['b','m','p']);options('#finals','final',['a','i','u']);options('#tones','tone',[1,2,3,4]);
function addShooter(row,col){const p={id:shooters.length+1,row,col};shooters.push(p);const cell=cellAt(row,col);cell.classList.add('receiver');const b=document.createElement('button');b.className='shooter';b.dataset.shooter=p.id;b.setAttribute('aria-label',`${row?'下':'上'}路 ${p.id} 号射手`);b.innerHTML=`<div class="plant"><svg><use href="#slinger"/></svg></div><b>${p.id}</b>`;b.onclick=()=>{if(busy||drag)return;if(picking&&compatible().includes(p))void shoot(p);else if(picking)toast('选亮着的伙伴');else if(ready)toast('把子弹拖给伙伴');};cell.append(b);return p;}
function render(){const t=target(),d=t?drafts[t.id]:empty(),complete=!!(d.initial&&d.final&&d.tone);ready=!!t&&!busy&&complete&&['initial','final','tone'].every(k=>d[k]===t[k]);const eligible=compatible();$('#target').textContent=t?.text??'✦';$('#target-route').textContent=t?(t.row?'下路':'上路'):'完成';$('#count').textContent=enemies.filter(e=>e.dead).length;$('#number').textContent=1;
for(const key of ['initial','final','tone']){const slot=$(`[data-slot="${key}"]`);slot.querySelector('b').textContent=(key==='tone'?marks[d[key]]:d[key])||'—';slot.classList.toggle('empty',!d[key]);slot.classList.toggle('check',!!t&&complete&&d[key]!==t[key]);}
$$('.chip').forEach(b=>{const checked=String(d[b.dataset.key])===b.dataset.value;b.classList.toggle('selected',checked);b.setAttribute('aria-pressed',checked);b.disabled=busy||!t;});
for(const e of enemies){e.el.classList.toggle('selected-target',e.id===targetId&&!e.dead);e.el.disabled=busy||e.dead;e.el.style.visibility=e.dead?'hidden':'visible';e.el.setAttribute('aria-pressed',e.id===targetId&&!e.dead);}
$('#ammo').disabled=!ready;$('#ammo').textContent=ready?t.pinyin:'···';$('#ammo').classList.toggle('ready',ready);$('#ammo-caption').setAttribute('aria-disabled',!ready);$('#ammo-caption').innerHTML=ready?`<strong>${picking?'选伙伴':eligible.length===1?'发射 ↗':eligible.length?'选射手 ↗':'种伙伴 ＋'}</strong>`:busy?'✦':'● ● ●';$('#hint').textContent=picking?'点一个发光的射手':ready?'拖子弹给同行射手':'点场上汉字切换目标；每个字的拼音选择都会保留';
$$('.plot').forEach(c=>c.classList.remove('can-catch','over','pick-pulse','needs-shooter'));if(ready){eligible.forEach(p=>{const c=cellAt(p.row,p.col);c.classList.add('can-catch');c.classList.toggle('pick-pulse',picking);});if(!eligible.length)for(let col=0;col<t.col;col++)if(!shooters.some(p=>p.row===t.row&&p.col===col))cellAt(t.row,col).classList.add('needs-shooter');}
$$('.progress i').forEach((e,i)=>e.classList.toggle('done',i<enemies.filter(e=>e.dead).length));$('#partner').disabled=busy||!t||shooters.length>=6;$('#partner-note').textContent='备用伙伴';}
function chooseShot(){if(!ready||busy||drag)return;const available=compatible();if(available.length===1)void shoot(available[0]);else if(available.length>1){picking=!picking;render();if(picking)toast('选一个亮着的伙伴');}else{toast('这条路需要伙伴');render();}}
function rectHit(r,x,y,pad=0){return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;}
// Visual sprite centre is 47 px above the finger; use that point first, then the finger.
function pickAt(items,rectFor,x,y,pad){for(const yy of [y-47,y]){const candidates=items.filter(p=>rectHit(rectFor(p),x,yy,pad));if(candidates.length)return candidates.sort((a,b)=>{const ra=rectFor(a),rb=rectFor(b);return Math.hypot(x-ra.left-ra.width/2,yy-ra.top-ra.height/2)-Math.hypot(x-rb.left-rb.width/2,yy-rb.top-rb.height/2);})[0];}return null;}
function receiverAt(x,y){return pickAt(shooters,p=>cellAt(p.row,p.col).getBoundingClientRect(),x,y,12);}
function emptyCellAt(x,y){return pickAt($$('.lane>.plot').filter(c=>Number(c.dataset.col)<3&&!shooters.some(p=>p.row===Number(c.dataset.row)&&p.col===Number(c.dataset.col))),c=>c.getBoundingClientRect(),x,y,0);}
function stopDemo(){handAnimation?.cancel();handAnimation=null;hand?.remove();hand=null;}
function beginDrag(e,kind){if(e.button!==0||busy||drag||!target()||kind==='ammo'&&!ready||kind==='partner'&&shooters.length>=6)return;stopDemo();const source=e.currentTarget;source.setPointerCapture(e.pointerId);const ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=kind==='partner'?'<svg><use href="#slinger"/></svg>':target().pinyin;ghost.style.display='none';document.body.append(ghost);drag={id:e.pointerId,kind,source,ghost,startX:e.clientX,startY:e.clientY,moved:false,targetId};}
function moveDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>7)d.moved=true;if(!d.moved)return;d.ghost.style.display='grid';d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';d.source.classList.add('drag-source');$$('.plot').forEach(c=>c.classList.remove('over','drop-hover','drop-ok'));if(d.kind==='partner'){$$('.lane>.plot').filter(c=>Number(c.dataset.col)<3&&!c.classList.contains('receiver')).forEach(c=>c.classList.add('drop-ok'));emptyCellAt(e.clientX,e.clientY)?.classList.add('drop-hover');}else{const p=receiverAt(e.clientX,e.clientY);if(p&&compatible().includes(p))cellAt(p.row,p.col).classList.add('over');}}
async function returnHome(d){const r=d.source.getBoundingClientRect();const a=d.ghost.animate([{left:d.ghost.style.left,top:d.ghost.style.top,opacity:1},{left:r.left+r.width/2+'px',top:r.top+r.height+'px',opacity:0}],{duration:230,fill:'forwards',easing:'ease-out'});try{await a.finished;}catch{}d.ghost.remove();}
function endDrag(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;d.source.classList.remove('drag-source');$$('.plot').forEach(c=>c.classList.remove('over','drop-ok','drop-hover'));if(cancel){d.ghost.remove();render();return;}if(!d.moved){d.ghost.remove();if(d.kind==='ammo')chooseShot();else toast('拖到空地');return;}if(d.targetId!==targetId){d.ghost.remove();return;}
if(d.kind==='partner'){const cell=emptyCellAt(e.clientX,e.clientY);if(cell){addShooter(Number(cell.dataset.row),Number(cell.dataset.col));d.ghost.remove();toast('伙伴到位');render();}else{void returnHome(d);toast('拖到空地');}}else{const p=receiverAt(e.clientX,e.clientY);if(p&&compatible().includes(p)){d.ghost.remove();void shoot(p);}else{void returnHome(d);toast(p?'换到同一路':'子弹回来啦');render();}}}
for(const [id,kind]of [['#partner','partner'],['#ammo','ammo']]){const el=$(id);el.onpointerdown=e=>beginDrag(e,kind);el.onpointermove=moveDrag;el.onpointerup=e=>endDrag(e);el.onpointercancel=e=>endDrag(e,true);el.onlostpointercapture=e=>{if(drag)endDrag(e,true);};}
$('#ammo').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseShot();}};$('#ammo-caption').onclick=chooseShot;$('#ammo-caption').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseShot();}};
function burst(x,y){for(let i=0;i<9;i++){const star=document.createElement('div');star.className='hit-star';star.textContent=i%2?'✦':'●';star.style.left=x+'px';star.style.top=y+'px';document.body.append(star);const a=star.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(i*7)*85}px,${Math.sin(i*7)*65}px) scale(.2)`,opacity:0}],{duration:600,fill:'forwards'});a.onfinish=()=>star.remove();}}
async function shoot(p){const t=target();if(!t||!ready||busy||!compatible().includes(p))return;const version=epoch;busy=true;picking=false;render();const plant=cellAt(p.row,p.col).querySelector('.plant');plant.classList.add('shoot');toast(`${p.id}号 · ${t.pinyin}！`);const from=cellAt(p.row,p.col).getBoundingClientRect(),to=t.el.getBoundingClientRect();const ball=document.createElement('div');ball.className='projectile';ball.dataset.from=p.id;ball.dataset.target=t.id;ball.textContent=t.pinyin;ball.style.left=from.left+from.width/2+'px';ball.style.top=from.top+from.height*.4+'px';document.body.append(ball);const a=ball.animate([{transform:'translate(-50%,-50%) scale(.6)'},{transform:`translate(${to.left+to.width/2-from.left-from.width/2}px,${to.top+to.height*.65-from.top-from.height*.4}px) scale(1)`}],{duration:700,easing:'cubic-bezier(.2,.6,.4,1)',fill:'forwards'});try{await a.finished;}catch{}ball.remove();if(version!==epoch)return;t.el.classList.add('hit');burst(to.left+to.width/2,to.top+to.height/2);setTimeout(()=>{if(version!==epoch)return;t.dead=true;plant.classList.remove('shoot');busy=false;const next=enemies.filter(e=>!e.dead).sort((a,b)=>a.col-b.col||a.row-b.row)[0];targetId=next?.id??'';if(!next)$('#finish').classList.add('show');render();},500);}
function reset(){epoch++;stopDemo();clearTimeout(toastTimer);if(drag){drag.source.classList.remove('drag-source');drag.ghost.remove();drag=null;}$$('.ghost,.projectile,.hit-star,.enemy,.shooter').forEach(e=>e.remove());$$('.lane>.plot').forEach(c=>c.className='plot');enemies=definitions.map(t=>({...t,dead:false}));shooters=[];drafts=Object.fromEntries(enemies.map(e=>[e.id,empty()]));targetId='rice';busy=false;picking=false;$('#finish').classList.remove('show');$('#toast').classList.remove('show');for(const e of enemies){const b=document.createElement('button');b.className='enemy';b.dataset.target=e.id;b.setAttribute('aria-label',`选择${e.row?'下':'上'}路目标${e.text}`);b.innerHTML=`<span class="enemy-glyph">${e.text}</span><svg><use href="#blob"/></svg>`;b.style.left=`calc(${(e.col+.5)*20}% - 37px)`;b.onclick=()=>setTarget(e.id);$('#lane'+e.row).append(b);e.el=b;}addShooter(0,0);addShooter(1,0);addShooter(1,1);render();}
$('#reset').onclick=reset;$('#again').onclick=reset;
$('#demo').onclick=()=>{stopDemo();const available=compatible(),source=ready?$('#ammo'):target()?.el,destination=ready&&available.length?cellAt(available[0].row,available[0].col):source;if(!source||!destination)return;const a=source.getBoundingClientRect(),b=destination.getBoundingClientRect();hand=document.createElement('div');hand.className='tutorial-hand';hand.textContent='☝️';document.body.append(hand);hand.style.left=0;hand.style.top=0;handAnimation=hand.animate([{transform:`translate(${a.left+a.width/2}px,${a.top+a.height/2}px)`,opacity:0},{transform:`translate(${a.left+a.width/2}px,${a.top+a.height/2}px)`,opacity:1,offset:.2},{transform:`translate(${b.left+b.width/2}px,${b.top+b.height/2}px)`,opacity:1,offset:.8},{transform:`translate(${b.left+b.width/2}px,${b.top+b.height/2}px)`,opacity:0}],{duration:1600,iterations:2});handAnimation.onfinish=stopDemo;toast(ready?'拖给亮着的伙伴':'点汉字，换目标');};
window.addEventListener('blur',()=>{if(drag)endDrag({pointerId:drag.id},true);});reset();
</script></body></html>
